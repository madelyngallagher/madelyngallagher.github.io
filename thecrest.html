    <div class="work-scroll">
      <div class="work-track-c">
        <img
          src="images/getahobby.webp"
          class="poster-img"
          data-title="Gen Z goes analog at St. Thomas, one craft at a time
"
          data-desc="This design showcases the resurgence of analog activities among Gen Z students at the University of St. Thomas. It has to be one of my favorite designs I've made for The Crest, especially since I find this topic relevant to my own interests. The design features graphics of analog activities, such as crocheting, coloring, and photography, set against a backdrop of calm colors and playful typography. This piece highlights the growing interest in traditional crafts among students."
        />

        <img
          src="images/oscars.webp"
          class="poster-img"
          data-title="
OPINION: Every movie you should catch up on (or skip) before Oscars 2026"
          data-desc="To highlight what to look forward to at the 2026 Oscar Awards, this design takes a classy approach with a black background and gold accents. The title is displayed in elegant typography, drawing attention to the key message. The design features a curated selection of movie posters arranged in a visually appealing layout, with movie clips in frames of some of the must-watch films. This article along with my design serve as a guide for movie lovers to navigate the Oscar season and choose which films to prioritize."
        />
        <img
          src="images/superbowl2.webp"
          class="poster-img"
          data-title="OPINION: The last 10 Super Bowls ranked"
          data-desc="This design highlights the last ten Super Bowls ranked, showcasing memorable moments and standout performances. The layout features a dynamic arrangement of game highlights and teams featured in the story, creating an engaging visual narrative for sports fans. The design incorporates bold typography and vibrant colors to capture the excitement of the Super Bowl, making it a fun piece for those interested in sports culture."
        />
        <img
          src="images/topmovies2025.webp"
          class="poster-img"
          data-title="RANKED: The 10 best movies of 2025"
          data-desc="This article ranks the top 10 movies of 2025. The layout features a clean and modern design with a collage of images taken from the mentioned movies, along with strips of film in the background. This piece vibrantly highlights the most anticipated films of the year, making it a valuable resource for movie enthusiasts."
        />
        <img
          src="images/fashionweek.webp"
          class="poster-img"
          data-title="OPINION: What’s next in fashion: The post-fashion week style forecast"
          data-desc="This design and article explore the latest trends in fashion following the conclusion of Fashion Week 2025. It features a modern layout with a focus on bold colors and dynamic typography, capturing the energy and excitement of the fashion industry. This was also one of my favorite designs I've made for The Crest, as I achieved creating a visually striking piece to accompany the article."
        />
        <img
          src="images/coachella_lineup.webp"
          class="poster-img"
          data-title="OPINION: Coachella’s mix of headliners is genius"
          data-desc="This design showcases the highly anticipated Coachella 2025 lineup, featuring a vibrant color scheme and unique typography to capture the festival's energetic atmosphere. The layout highlights Justin Bieber and Sabrina Carpenter, two headliners, and a subtle background of California."
        />
        <img
          src="images/polisci.webp"
          class="poster-img"
          data-title="Increased political violence sparks discussion within St. Thomas community"
          data-desc="This was an initially difficult design to think up. I had to appropriately convey the harsh topic of the article through a design, something I wasn't yet experienced in. With careful consideration of symbols, I came up with the combination of candles, signifying commemoration for those affected, as well as the American Flag, representing the nation enduring these challenging times."
        />
        <img
          src="images/incprices.webp"
          class="poster-img"
          data-title="St. Thomas community reflects on inflation, tariff concerns"
          data-desc="This article highlighted the economic concerns regarding inflation and tariff issues, communicated through a sarcastic, grocery store sign-esque design. The layout features a clean and modern design with a focus on data visualization and real-world examples, making it an informative piece."
        />
        <img
          src="images/2.13- Gallagher NCAA probation graphic.webp"
          class="poster-img"
          data-title="NCAA paves way for St. Thomas tournament eligibility starting fall 2025"
          data-desc="This design illustrates the impact of NCAA probation on St. Thomas athletics, using a bold and striking visual approach to convey the seriousness of the situation. I boldly used a photo of the NCAA trophy as the main and only image to further emphasize the situation."
        />
