    <div class="work-scroll">
      <div class="work-track-p">
        <img
          src="images/mayhemcoachella.png"
          class="poster-img"
          data-title="Mayhem at Coachella"
          data-desc="As someone who thoroughly enjoys live music and is a huge Lady Gaga fan, her 2025 Coachella performance was unbelievable. I immediately designed a poster to commemorate one of the best Coachella performances I've ever seen as a personal project. I ensured the eccentric color theme of black and orange matched the concept of her new album, Mayhem."
        />
        <img
          src="images/prideandprejudicefinal.png"
          class="poster-img"
          data-title="Pride and Prejudice"
          data-desc="This piece was a gift for my partner, who is a big fan of Pride and Prejudice. I experimented with textures beyond my usual use, communicating the bottom image as something sort of 'taped in,' and emphasizing the tension between the two main characters. The color scheme was taken directly from the main image I used, which was different from my usual style of limited colors."
        />
        <img
          src="images/diewithasmilewtex.png"
          class="poster-img"
          data-title="Die With a Smile"
          data-desc="I designed this poster upon the release of the single Die With a Smile by Lady Gaga and Bruno Mars. I took much inspiration from the music video with the vibrant red and blue color scheme and vintage aesthetic."
        />
        <img
          src="images/revengeofthesith copy.png"
          class="poster-img"
          data-title="Revenge of The Sith"
          data-desc="During my senior year of high school, I made this for an assignment in my digital art class. I had been inspired by many movie poster designs I had come across at the time in this graphic novel-esque style, highlighting key character moments and using a very 'sith' color scheme."
        />
        <img
          src="images/drama.png"
          class="poster-img"
          data-title="Drama"
          data-desc="Inspired by Aespa's Drama musc video, I designed this poster in the style of a movie poster. The music video maintained a theme of an action film and was executed incredibly. I experimented more with the type, by replacing the font of certain letters in the title's typography as well as adding a blood splatter within the title to fit the theme."
        />
        <img
          src="images/shameless.png"
          class="poster-img"
          data-title="Shameless"
          data-desc="I designed this simple, yet loud poster while binging the TV show Shameless. While I usually default to more muted and monotone colors, I decided to color the main image a maroon red and text and use a loud yellow in the negative space. Its simple elements come together to portray a chaotic, DIY style, reflecting the nature of the series."
        />
        <img
          src="images/kust x the crest.png"
          class="poster-img"
          data-title="KUST x The Crest"
          data-desc="While working at The Crest, I was assigned a non-news-related design project for KUST and The Crest's live music event. This poster promoted the event on multiple social media platforms and was physically displayed throughout the Shoenecker Center at St. Thomas. The layout process was definitely  difficult trying to balance the elements. However, it ended up looking great in both digital and print formats, especially thanks to my use of texture."
        />
        <img
          src="images/intothewild.png"
          class="poster-img"
          data-title="Into the Wild"
          data-desc="I designed this poster for one of my English classes, interestingly enough. We were given creative freedom to explore themes of the class,'Narrating the Environment in Literature and Film'. We had to watch the film Into the Wild, which I found very visually inspiring. I wanted to create a poster that reflected the themes of nature in the film, while also incorporating an aesthetic that matched the tone of the story. I incorporated many themes and direct imagery from the film, such as the bus and the photos, to create something that was both  appealing and relevant."
        />
        <img
          src="images/coruscantfinal.png"
          class="poster-img"
          data-title="Into the Wild"
          data-desc="I designed this poster for one of my English classes, interestingly enough. We were given creative freedom to explore themes of the class,'Narrating the Environment in Literature and Film'. We had to watch the film Into the Wild, which I found very visually inspiring. I wanted to create a poster that reflected the themes of nature in the film, while also incorporating an aesthetic that matched the tone of the story. I incorporated many themes and direct imagery from the film, such as the bus and the photos, to create something that was both  appealing and relevant."
        />
