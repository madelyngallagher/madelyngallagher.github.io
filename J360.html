    <div class="posters">
      <h1 class="design-header">threesixty journalism</h1>

    <div class="work-scroll">
      <div class="work-track-p">
        <img
          src="images/threesixty flyer.webp"
          class="poster-img"
          data-title="Promotional Flyer"
          data-desc="The client called for a promotional flyer. I left this template open to interpretation, but I wanted to create something that was eye-catching and communicated the idea of ThreeSixty Journalism. I used a very purple color scheme and a playful layout to reflect the name of the organization and its mission."
        />
        <img
          src="images/cover mockup.webp"
          class="poster-img"
          data-title="Multimedia Instagram Cover Template"
          data-desc="This is apart of a collection of multimedia social media templates the client called for. This is a simple Instagram cover template used for more lighthearted stories. I wanted to create something that was versatile and could be used for a variety of stories, while still being visually appealing and on-brand for ThreeSixty Journalism. I inserted content from one of their existing posts to show how the template could be used."
        />
        <img
          src="images/1 photo mockup.webp"
          class="poster-img"
          data-title="Multimedia Instagram Image Template"
          data-desc="This is apart of a collection of multimedia social media templates the client called for. This leaves room for one image and text. I wanted to create something that was versatile and could be used for a variety of stories, while still being visually appealing and on-brand for ThreeSixty Journalism. I inserted content from one of their existing posts to show how the template could be used."
        />
        <img
          src="images/audio.webp"
          class="poster-img"
          data-title="Multimedia Instagram Audio Template"
          data-desc="This is apart of a collection of multimedia social media templates the client called for. This leaves room for one audio file with a visual audio animation, photo, and text. I wanted to create something that was versatile and could be used for a variety of stories, while still being visually appealing and on-brand for ThreeSixty Journalism. I inserted content from one of their existing posts to show how the template could be used."
        />
      </div>
