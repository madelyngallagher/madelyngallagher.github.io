    <div class="posters">

    <div class="work-scroll">
      <div class="work-track-p">
        <img
          src="images/begreen.png"
          class="poster-img"
          data-title="Be Green"
          data-desc="This design promotes the benefits of owning houseplants and presents images of greenery. As this is a personal project and a concept design, the bottom text contains filler text."
        />
        <img
          src="images/vinylrecordshort.png"
          class="poster-img"
          data-title="Vinyl Record"
          data-desc="This infographic contains research of the history and mechanics of vinyl records, a personal interest of mine. While creating this design, I implemented the use of paths to wrap text around an image for the first time, creating an interesting effect."
        />
        <img
          src="images/1.png"
          class="poster-img"
          data-title="UST North Campus Map"
          data-desc="This infographic was a social media post for The Crest. The goal of the design was to create a visually appealing and informative map of the University of St. Thomas' North Campus, labeling what areas are public/private. This was made during the time ICE was romaing the TWin Cities, to better inform our community. I wanted to create a design that was both functional and aesthetically pleasing, while also incorporating the university's branding and colors."
        />
        <img
          src="images/2.png"
          class="poster-img"
          data-title="UST South Campus Map"
          data-desc="This infographic was a social media post for The Crest. The goal of the design was to create a visually appealing and informative map of the University of St. Thomas' South Campus, labeling what areas are public/private. This was made during the time ICE was romaing the TWin Cities, to better inform our community. I wanted to create a design that was both functional and aesthetically pleasing, while also incorporating the university's branding and colors."
        />
      </div>
